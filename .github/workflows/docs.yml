name: Build MkDocs Documentation

# Este workflow solo construye la documentación pero NO la despliega a GitHub Pages
# GitHub Pages ahora muestra el preview de la aplicación desde production/preview

on:
  push:
    branches:
      - main
      - docs/documentation
      - "docs/workflow"
  workflow_dispatch:

permissions:
  contents: read

# Deshabilitado el deployment a Pages - ahora lo hace preview-deploy.yml
# concurrency:
#   group: "pages"
#   cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install mkdocs mkdocs-material pymdown-extensions mkdocs-minify-plugin

      - name: Build MkDocs site
        run: mkdocs build --strict

      - name: Check build success
        run: echo "✅ Documentation built successfully! Docs are available in ./site directory"

  # Deploy job DESHABILITADO - GitHub Pages ahora muestra el preview de la aplicación
  # Para ver la documentación, construye localmente con: mkdocs build && mkdocs serve

